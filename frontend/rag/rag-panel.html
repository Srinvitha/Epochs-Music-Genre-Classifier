<!-- Epochs 1.5 — paste this inside the results section, after Song DNA -->
<section class="rag-panel" id="askEpochsPanel">
  <div class="rag-panel-head">
    <div class="rag-heading-group">
      <div class="rag-kicker"><span class="rag-kicker-line"></span>EPOCHS 1.5 · INTELLIGENCE LAYER</div>
      <div class="rag-title-row">
        <div class="rag-orb" aria-hidden="true">
          <span class="rag-orb-core"></span>
          <span class="rag-orb-ring rag-orb-ring-a"></span>
          <span class="rag-orb-ring rag-orb-ring-b"></span>
          <span class="rag-orb-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <div>
          <h2>Ask the music<span class="rag-title-period">.</span></h2>
          <p>Grounded explanations for your Song DNA — retrieved from Epochs knowledge before answering.</p>
        </div>
      </div>
    </div>
    <span class="rag-badge"><span class="rag-badge-dot"></span>LOCAL RAG</span>
  </div>

  <div class="rag-prompt-label">EXPLORE THIS ANALYSIS <span>·</span> SELECT A STARTING POINT</div>
  <div class="rag-questions">
    <button type="button" data-rag-question="Why did Epochs classify this song this way?"><span class="rag-chip-icon">↗</span><span>Why this genre?</span></button>
    <button type="button" data-rag-question="How should I interpret the BPM of this song?"><span class="rag-chip-icon">◷</span><span>Decode the tempo</span></button>
    <button type="button" data-rag-question="How does this song's energy compare with the FMA reference dataset?"><span class="rag-chip-icon">∿</span><span>Read the energy</span></button>
    <button type="button" data-rag-question="What audio features contribute to the classifier?"><span class="rag-chip-icon">✳</span><span>Explore 61 features</span></button>
  </div>

  <div class="rag-input-shell">
    <div class="rag-input-row">
      <span class="rag-input-spark" aria-hidden="true">✳</span>
      <input id="ragQuestion" type="text" placeholder="Ask something about this Song DNA…" autocomplete="off" aria-label="Ask Epochs about this analysis">
      <button id="ragAskButton" type="button"><span class="rag-send-label">Ask Epochs</span><span class="rag-send-icon" aria-hidden="true">↗</span></button>
    </div>
    <div class="rag-input-foot"><span><span class="rag-foot-dot"></span> Answers grounded in retrieved knowledge</span><span>ENTER ↵</span></div>
  </div>

  <div id="ragAnswer" class="rag-answer hidden" aria-live="polite" aria-busy="false"></div>
  <div id="ragSources" class="rag-sources hidden"></div>
</section>
